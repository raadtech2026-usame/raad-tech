# RAAD Platform — Flutter mobile app (Parent + Driver).
#
# Priority 1 Item 9 (PROJECT_STATUS.md) / Phase M0 (docs/architecture/
# frontend-flutter-master-roadmap.md §5). Dependency choices below follow that roadmap's own
# M0 scope exactly — each one was already named and justified there, not freelanced here:
#
#   flutter_riverpod  - state management ("proposed - more testable than BLoC for a two-role
#                       app this size, less ceremony, still enforces the same presentation ->
#                       domain -> data layering `.claude/rules/flutter.md` #5 requires").
#   flutter_secure_storage - "the standard, approved-by-necessity choice for 'tokens in secure
#                       storage' per flutter.md #5" - refresh token lives here; the access
#                       token stays in memory only (this app's own AuthController), mirroring
#                       the roadmap's own stated pattern and the web dashboard's identical
#                       in-memory-access-token posture.
#   web_socket_channel - the official Dart team package for WebSocket clients - needed for
#                       /ws/tracking (live position) exactly as documented (API Contracts §11).
#   http              - the networking client the roadmap names generically ("networking
#                       client") without picking a specific package; chosen over `dio` for the
#                       same reason this backend's own core/observability/metrics.py prefers a
#                       small primitive over a general-purpose framework where the actual need
#                       (JSON REST calls, bearer auth header, one error envelope shape) doesn't
#                       justify dio's extra surface (interceptors, transformers) this app
#                       doesn't use.
#
# No Firebase/FCM dependency yet - Phase M4 (push notifications) needs a real Firebase project
# (google-services.json / GoogleService-Info.plist, real API keys), which does not exist in
# this engagement; adding the dependency without real config to point it at would be dead
# weight, not a working feature. See mobile/README.md's own "Known gaps" section.
#
# ADR-0026 (Parent Video Access Authorization) additions, user-approved before adding
# (`.claude/rules/workflow.md` rule 1):
#
#   media_kit / media_kit_video / media_kit_libs_video - MIT license. FLV decode/render for the
#                       permission-gated live video player (features/video/). The JT1078 relay
#                       speaks a bespoke WS-FLV protocol (binary WebSocket frames carrying FLV
#                       bytes) that no Flutter media package understands directly - this app
#                       connects via the already-approved web_socket_channel above, re-serves
#                       the received bytes over a local loopback dart:io.HttpServer (stdlib,
#                       no new dependency) as a continuous byte stream, and points media_kit's
#                       player widget at that local http:// URL - media_kit is never asked to
#                       speak the relay's own protocol, only an ordinary network stream.
#                       media_kit_libs_video pulls in the actual native libmpv binaries per
#                       platform (media_kit/media_kit_video alone are pure-Dart wrappers with no
#                       decoder of their own).
name: raad_mobile
description: RAAD Platform mobile app (Parent + Driver roles).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^2.4.5
  http: ^1.2.1
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
