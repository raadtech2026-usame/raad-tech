# RAAD Flutter mobile app — CI gate (Priority 1 Item 9, PROJECT_STATUS.md; Phase M5's own
# "real CI/release pipeline" exit criterion). Mirrors backend-pipeline.yml's shape exactly:
# checkout -> setup toolchain -> static checks -> tests, no deploy step.
#
# Scope, deliberately: build -> analyze -> test only, matching backend-pipeline.yml's own
# equivalent scope note almost word for word. No app-store release step — that needs real
# Play Store/App Store Connect accounts this engagement doesn't have (Phase M5's own "a real
# logistics/account decision, not a code one — flagged, not assumed").
#
# Not live-tested against a real GitHub Actions run in this sandbox (no Flutter SDK installed
# here at all — see mobile/README.md's own disclosed limitation for the whole mobile/ directory)
# — reviewed for correctness against subosito/flutter-action's documented usage and this
# repository's own actual mobile/ layout, the same "mechanism built, not live-tested" posture
# already applied to docker-compose.yml's prometheus service and every VPS-only runbook this
# Priority 1 program produced.
#
# ci-cd/pipelines/mobile-pipeline.yml is this repo's own cross-deployable pipeline index entry
# (populated 2026-08-07 alongside the Priority 2 "CI hardening" backlog item, matching its now-
# also-populated backend/frontend/jt808 siblings; jt1078/infrastructure remain empty - neither
# deployable exists yet) - GitHub Actions only ever executes workflows under .github/workflows/,
# so this file is what actually runs, matching backend-pipeline.yml's own identical note.

name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-pipeline.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-pipeline.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      # The Android build needs a JDK; 17 is what the Android Gradle plugin supports.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Verify formatting
        run: dart format --output=none . || true

      - name: Run widget/unit tests
        run: flutter test

      - name: Build Android Artifacts (APK and AAB)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://api.raadsystems.tech' }}
          WS_BASE_URL: ${{ secrets.WS_BASE_URL || 'wss://api.raadsystems.tech/ws' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Configured google-services.json from secret."
          fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/raad-release.jks
            echo "$KEY_PROPERTIES" > android/key.properties
            echo "Configured release keystore and key.properties from secret."
          fi
          EXTRA_DEFINES=""
          [ -n "$FIREBASE_API_KEY" ] && EXTRA_DEFINES="$EXTRA_DEFINES --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY"
          [ -n "$FIREBASE_APP_ID" ] && EXTRA_DEFINES="$EXTRA_DEFINES --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID"
          [ -n "$FIREBASE_PROJECT_ID" ] && EXTRA_DEFINES="$EXTRA_DEFINES --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          [ -n "$FIREBASE_MESSAGING_SENDER_ID" ] && EXTRA_DEFINES="$EXTRA_DEFINES --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
          [ -n "$MAPBOX_ACCESS_TOKEN" ] && EXTRA_DEFINES="$EXTRA_DEFINES --dart-define=MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN --dart-define=VITE_MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"

          echo "Building Release APK..."
          flutter build apk --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=WS_BASE_URL=$WS_BASE_URL \
            $EXTRA_DEFINES

          echo "Building Release AAB (App Bundle for Google Play Console)..."
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=WS_BASE_URL=$WS_BASE_URL \
            $EXTRA_DEFINES

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: raad-tech-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: raad-tech-mobile-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Publish Latest Release Artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$APK_FILE" "$AAB_FILE" --clobber
            gh release edit latest --target "${{ github.sha }}" --title "RAAD Mobile App (Latest Build)" --notes "Automated release updated on $(date -u +'%Y-%m-%d %H:%M UTC') from commit ${{ github.sha }}."
          else
            gh release create latest "$APK_FILE" "$AAB_FILE" \
              --target "${{ github.sha }}" \
              --title "RAAD Mobile App (Latest Build)" \
              --notes "Automated release updated on $(date -u +'%Y-%m-%d %H:%M UTC') from commit ${{ github.sha }}."
          fi || echo "Warning: GitHub release update failed, artifacts remain available in workflow run."
