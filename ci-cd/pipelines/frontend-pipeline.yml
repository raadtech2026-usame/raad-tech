# RAAD Web Dashboard — pipeline index entry, not an executable workflow.
#
# The actual, executable CI gate lives at `.github/workflows/frontend-pipeline.yml` — GitHub
# Actions only ever runs workflows placed under `.github/workflows/`, so a second copy of the
# same YAML here would just be an unenforced, driftable duplicate. This file exists only as
# this repo's own organizational placeholder alongside its four siblings
# (backend/mobile/jt808/jt1078-pipeline.yml, `infrastructure-pipeline.yml`), so all five
# deployables' pipeline status can be found in one place — see that real workflow file for the
# actual build -> test stages and the reasoning behind its current scope (no lint step, no
# security-scan step — both explained in its own header comment).
#
# Status: frontend's own CI gate is implemented (Priority 2 "CI hardening" backlog item,
# `PROJECT_STATUS.md` Section 5, 2026-08-07).
