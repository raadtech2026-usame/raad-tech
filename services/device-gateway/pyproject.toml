# Device Gateway — package configuration (device-gateway multi-vendor architecture, formerly
# `raad-jt808-service`; see `docs/architecture/adr/0010-device-gateway-multi-vendor-architecture.md`).
#
# Independent deployable (`.claude/rules/architecture.md` #2) — no dependency on
# `backend/raad` and vice versa. Phases 9.1-9.6 used only the Python standard library
# (`asyncio`/`dataclasses`/`logging`/`enum`) — zero third-party dependencies through the initial
# JT/T 808 build-out and the subsequent LSZ MDVR vendor adapter (B1/B2).
#
# APPROVED (device-gateway Redis integration, user-confirmed): `redis` (the same `redis-py`/
# `redis.asyncio` client already approved for the Business API, Backend Stabilization phase /
# ADR-0008) — same version pin as `backend/pyproject.toml` for consistency, though the two
# deployables' dependency manifests remain fully independent (`.claude/rules/workflow.md` #1/#2:
# approval for one deployable is not automatic approval for another). Backs:
# (1) `RedisEventPublisher` — publishes `DevicePositionReported`/`DeviceOnline`/`DeviceOffline`/
#     `DeviceAlarmRaised` onto the shared `raad:events` Redis Stream (ADR-0008) every vendor
#     adapter uses identically, so the Business API's `tracking/events/subscribers.
#     DevicePositionReportedProcessor` (and any future consumer of the other three) receives them.
# (2) `RedisDeviceRegistryProjection` — replaces the interim in-memory allow-lists
#     (`NullDeviceProvisioningPort`/`InMemoryMdvrDeviceProvisioningPort`) with a real projection
#     consuming `fleet_device`'s own `DeviceRegistered`/`DeviceActivated`/`DeviceSuspended`/
#     `DeviceAssignedToVehicle`/`DeviceUnassignedFromVehicle` events off the same broker.
# (3) `RedisDeviceSessionRegistry` — Redis-backed `DeviceSessionRegistry` (`.claude/rules/
#     jt808.md` #4's "session state lives in Redis"), replacing the in-memory default.
#
# Dependency management tool (Poetry/PDM/plain pip) is not yet decided by approved
# documentation — this file uses the PEP 621 format, installable with plain
# `pip install -e .` regardless of that later choice, the same stance `backend/pyproject.toml`
# takes.

[project]
name = "raad-device-gateway-service"
version = "0.2.0"
description = "RAAD Platform — multi-vendor device-plane gateway (JT/T 808, LSZ MDVR, ...)"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
