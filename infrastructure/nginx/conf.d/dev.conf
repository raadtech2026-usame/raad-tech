# RAAD Platform — Nginx gateway, local development (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). The single public entrypoint for the whole dev stack: /api,
# /health, and /ws (.claude/rules/api.md #1/#2, the WebSocket phase's /ws/tracking and
# /ws/notifications) go to the Business API; everything else goes to the Vite dev server,
# including its own HMR WebSocket, so the browser only ever talks to one origin/port. Selected
# by docker-compose.yml's default `nginx` volume mount (docker-compose.prod.yml swaps this for
# prod.conf).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Vite dev server — HMR runs over its own WebSocket on this same origin/port, hence the
    # Upgrade headers here too (unlike prod.conf's equivalent location, which proxies to a
    # static-file nginx with nothing to upgrade).
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
