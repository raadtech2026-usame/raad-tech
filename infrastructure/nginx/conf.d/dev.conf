# RAAD Platform — Nginx gateway, local development (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). The single public entrypoint for the whole dev stack: /api,
# /health, and /ws (.claude/rules/api.md #1/#2, the WebSocket phase's /ws/tracking and
# /ws/notifications) go to the Business API; everything else goes to the Vite dev server,
# including its own HMR WebSocket, so the browser only ever talks to one origin/port. Selected
# by docker-compose.yml's default `nginx` volume mount (docker-compose.prod.yml swaps this for
# prod.conf).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker's embedded DNS server. Required because the upstream hosts below are referenced
    # through variables — which is the whole point: with a literal `proxy_pass http://backend:8000`
    # nginx resolves each name exactly once, at config-load time, and caches that IP for the
    # process's entire life. Live-reproduced 2026-09-02: `backend`, `worker` and `jt1078-relay`
    # were recreated while this container kept running, Docker reassigned addresses on the
    # bridge network, and nginx went on proxying to the *old* IPs — which by then belonged to
    # different containers entirely (nginx's "backend" 172.18.0.3 was actually the worker, its
    # "frontend" 172.18.0.5 was actually the backend). Every proxied request returned 502 and
    # nginx's own healthcheck flipped it to unhealthy, with nothing wrong on either side.
    # Naming the upstream in a variable forces re-resolution per request instead, honouring
    # `valid=10s`, so a recreated upstream is picked up within ten seconds with no nginx restart.
    # `ipv6=off` because these services bind IPv4 on the compose network and a AAAA answer would
    # just add a failing connect attempt.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Both `proxy_pass` forms below deliberately carry NO URI component (no path, not even a
    # trailing slash). For nginx that means "pass the original request URI through unchanged" —
    # identical to the literal form these replaced, so routing semantics are untouched; only the
    # name resolution moved from load-time to request-time.
    location /api/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $upstream_backend_health backend;
        proxy_pass http://$upstream_backend_health:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        set $upstream_backend_ws backend;
        proxy_pass http://$upstream_backend_ws:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Vite dev server — HMR runs over its own WebSocket on this same origin/port, hence the
    # Upgrade headers here too (unlike prod.conf's equivalent location, which proxies to a
    # static-file nginx with nothing to upgrade).
    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
