# RAAD Platform — Nginx gateway, production WITH TLS (ADR-0013 + Priority 1 Item 2,
# PROJECT_STATUS.md). Same routing shape as prod.conf — this is prod.conf's own previously-
# documented "once a real domain/cert exists" successor, not a different design. Selected by
# setting NGINX_PROD_CONF=prod-tls.conf in docker/.env once a real domain is pointed at this host
# AND the first certificate has been obtained (docs/runbooks/tls-setup.md) — deliberately NOT the
# default, so a fresh deployment stays on prod.conf (plain HTTP) until an operator explicitly
# opts in via that runbook's two-phase bootstrap.
#
# Bootstrapping note: nginx refuses to start at all if `ssl_certificate`/`ssl_certificate_key`
# don't exist on disk — so this file must never be the FIRST config a fresh deployment loads.
#
# ${DOMAIN_NAME} below is substituted by nginx's own official templating mechanism, not invented
# here: docker-compose.prod.yml mounts this file to /etc/nginx/templates/default.conf.template
# (not directly to conf.d/), and the stock nginx:1.27-alpine image's own entrypoint script
# (20-envsubst-on-templates.sh, standard since nginx 1.19's Docker image) runs envsubst against
# it at container startup, substituting only variable names that are ACTUALLY set in the
# container's environment — nginx's own runtime variables below ($host, $request_uri, $scheme,
# $http_upgrade, $remote_addr, $proxy_add_x_forwarded_for, $connection_upgrade) are never real
# environment variables, so they pass through untouched. prod.conf mounts through this same
# templates path too (docker-compose.prod.yml) for consistency, even though it has no ${} tokens
# — a no-op substitution for that file, not a behavior change.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # certbot re-validates domain ownership this way on every renewal, not just the first
    # request (scripts/tls/certbot-renew-loop.sh) — must keep working even after TLS is enabled.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Deliberately NOT redirected to HTTPS, unlike everything else on port 80: the nginx
    # container's own Docker healthcheck (docker-compose.yml) calls this over plain HTTP against
    # 127.0.0.1. A 301 here would send it to an HTTPS URL it has no clean way to validate (the
    # cert is issued for the real domain, not "127.0.0.1"), turning a healthy container into a
    # false-negative "unhealthy" the moment TLS is enabled.
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Everything else on port 80 redirects to HTTPS — the main behavioral difference from
    # prod.conf, which still serves the full site over plain HTTP.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Populated into the shared raad_certbot_conf volume by the certbot service
    # (docker-compose.prod.yml). ${DOMAIN_NAME} must match docker/.env's DOMAIN_NAME exactly —
    # that's the directory name certbot creates under /etc/letsencrypt/live/.
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 180 days, deliberately no `preload`/`includeSubDomains` yet — a conservative starting
    # point (docs/runbooks/tls-setup.md explains why), not an oversight: HSTS is a commitment
    # browsers cache client-side, so this stays modest until an operator has confirmed HTTPS is
    # genuinely stable in their own deployment.
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
