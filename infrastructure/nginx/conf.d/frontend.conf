# RAAD Web Dashboard — SPA fallback (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). Bind-mounted over nginx:alpine's own default.conf by
# docker-compose.prod.yml's `frontend` service (build.target: prod, docker/frontend.Dockerfile).
# Client-side routing (react-router-dom) means any deep-linked path must still resolve to
# index.html — root-relative asset paths (frontend/index.html) are served unmodified by the
# same try_files rule.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static text/code assets (PERF-01 remediation)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Vite content-hashed static assets — safe for long-term immutable client caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA index.html entry point — must never be cached immutably so clients receive fresh asset hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA routing fallback for client-side deep links
    location / {
        try_files $uri $uri/ /index.html;
    }
}

