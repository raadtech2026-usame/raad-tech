# RAAD Web Dashboard — SPA fallback (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). Bind-mounted over nginx:alpine's own default.conf by
# docker-compose.prod.yml's `frontend` service (build.target: prod, docker/frontend.Dockerfile).
# Client-side routing (react-router-dom) means any deep-linked path must still resolve to
# index.html — root-relative asset paths (frontend/index.html) are served unmodified by the
# same try_files rule.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
