# RAAD Platform — Nginx gateway, production (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). Same routing shape as dev.conf; `/` proxies to the frontend
# container's own nginx (the built static bundle — docker-compose.prod.yml's `frontend`
# build.target: prod, docker/frontend.Dockerfile) instead of a Vite dev server, so that location
# needs no Upgrade/HMR headers. Selected by docker-compose.prod.yml's `nginx` volume mount,
# overriding docker-compose.yml's own default mount of dev.conf.
#
# TLS is explicitly out of scope this phase — no domain name or certificate material was
# supplied, so this stays plain HTTP on the published port ($NGINX_PORT). Terminate TLS here (a
# `listen 443 ssl` server block + `ssl_certificate`/`ssl_certificate_key`, e.g. certbot-managed
# files bind-mounted from the VPS host) once a real domain/cert exists.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
