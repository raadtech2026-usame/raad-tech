# RAAD Platform — Nginx gateway, production (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). Same routing shape as dev.conf; `/` proxies to the frontend
# container's own nginx (the built static bundle — docker-compose.prod.yml's `frontend`
# build.target: prod, docker/frontend.Dockerfile) instead of a Vite dev server, so that location
# needs no Upgrade/HMR headers. Selected by docker-compose.prod.yml's `nginx` volume mount,
# overriding docker-compose.yml's own default mount of dev.conf.
#
# TLS is not enabled by this file — this is the fresh-deployment default
# (docker/.env.example's NGINX_PROD_CONF=prod.conf), plain HTTP on the published port
# ($NGINX_PORT). This file's job now is narrower than before: stay the safe, always-bootable
# starting point a brand-new VPS deployment runs while DNS propagates and the first certificate
# is obtained — see docs/runbooks/tls-setup.md's two-phase bootstrap. Once that first
# certificate exists, switch NGINX_PROD_CONF to prod-tls.conf (Priority 1 Item 2,
# PROJECT_STATUS.md) instead of editing this file in place.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ACME HTTP-01 challenge webroot (docs/runbooks/tls-setup.md) — present here, before TLS is
    # even enabled, specifically so `certbot certonly --webroot` has something real to validate
    # against on a fresh deployment. Harmless if certbot is never run.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # JT/T 1078 viewer WebSocket (ADR-0039 remediation of audit finding B1). Without this
    # location the relay's viewer socket is only reachable as a raw `ws://host:7911`, which a
    # browser on an HTTPS page refuses outright as mixed content — making live video and
    # intercom structurally unusable the moment TLS is enabled. Routing it here puts it behind
    # the same origin and the same certificate as everything else, and (unlike port 7911) 443
    # is a port Cloudflare will proxy.
    #
    # `rewrite` strips the `/jt1078` prefix so the relay sees its own `/viewer?token=...` shape.
    # The relay currently ignores the request path entirely and reads only the `token` query
    # parameter (`services/jt1078/src/viewer/viewer_server.py` discards `_path`), so this would
    # work without the rewrite too — it is here so the contract stays correct if the relay ever
    # does start validating its path, rather than silently depending on that being ignored.
    #
    # NOT to be confused with the relay's *ingest* port 7910: that carries raw JT/T 1078
    # extended-RTP from the MDVR, is not HTTP, and must stay a directly-published TCP port.
    location /jt1078/ {
        rewrite ^/jt1078/(.*)$ /$1 break;
        proxy_pass http://jt1078-relay:7911;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # A live video session can legitimately stay open far longer than nginx's 60s default,
        # and the relay sends no application-level keepalive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Media must reach the viewer as it arrives; buffering would add latency to a live feed.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
