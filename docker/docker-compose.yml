# RAAD Platform — base Docker Compose service definitions (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). Alone, this file fully starts a working dev environment —
# `docker compose -f docker/docker-compose.yml up -d --build` (or `cd docker && docker compose
# up -d --build` once `docker/.env` exists — copy it from `docker/.env.example`).
# docker-compose.dev.yml layers on hot-reload/DX conveniences; docker-compose.prod.yml layers on
# VPS-only overrides (frontend's static build, real secrets, the prod Nginx conf). Same images,
# same services, same topology in both environments — see docker/README.md for exact commands.
#
# Per docs/business/RAAD_Phase2_Enterprise_Architecture_v1_2.md §11, MVP deployables are:
# Business API, Workers, JT808 TCP Server, JT1078 Video Server, plus PostgreSQL (ADR-0002),
# Redis, and an event broker. `services/jt1078/` stays out of this file — still no approved
# language/runtime (structural scaffold only), so there is nothing to containerize yet.
#
# `worker` is not one of the platform pieces named when this file was requested, but it's the
# already-built `python -m raad.interfaces.workers.bootstrap` process (Backend LLD §11.1) that
# the Notification/Report Workers, the outbox relay, and the three scheduled jobs run under —
# without a container running it, none of those ever fire in this stack. `migrate` is a one-off
# `alembic upgrade head` job, not a platform service — it exists so `backend`/`worker` never race
# each other to apply migrations on startup.

x-backend-build: &backend-build
  context: ../backend
  dockerfile: ../docker/backend.Dockerfile

x-backend-env: &backend-env
  RAAD_ENVIRONMENT: ${RAAD_ENVIRONMENT:-dev}
  RAAD_DB__URL: postgresql+asyncpg://${POSTGRES_USER:-raad}:${POSTGRES_PASSWORD:-raad}@postgres:5432/${POSTGRES_DB:-raad}
  # Priority 1 Item 4 (PROJECT_STATUS.md, Redis production hardening): `redis://:PASSWORD@host/db`
  # — empty username, password only, the standard form `redis.asyncio.Redis.from_url` (and the
  # `redis` service's own `--requirepass` below) already expects, no code change needed to parse
  # it. DB 0 (cache/rate-limit/geofence) vs DB 1 (event broker/lock/DLQ) mirrors
  # `.github/workflows/backend-pipeline.yml`'s own already-established split (that workflow's
  # `RAAD_REDIS__URL`/`RAAD_BROKER__URL` already differ by db number) — adopted here for the
  # first time so a `FLUSHDB`/inspection on one logical namespace can never collide with the
  # other's data, even though both still share the one Redis *process*/`maxmemory` budget below.
  RAAD_REDIS__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/0
  RAAD_BROKER__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
  RAAD_AUTH__JWT_SECRET_KEY: ${RAAD_AUTH__JWT_SECRET_KEY:-dev-only-change-me}
  RAAD_CORS__ALLOWED_ORIGINS: '${RAAD_CORS__ALLOWED_ORIGINS:-["http://localhost"]}'
  RAAD_OBSERVABILITY__LOG_LEVEL: ${RAAD_OBSERVABILITY__LOG_LEVEL:-INFO}
  # ADR-0022: env vars, composition-root only — never SystemSetting (org_admin holds
  # admin.settings.read/.update too). Both default empty, leaving PaymentProviderPort unbound
  # (core/di/bootstrap.py), the same "fail loudly at the one method that needs it, not the whole
  # service" posture backend/.env.example's own comment on these two vars describes in full.
  RAAD_PAYMENT__PROVIDER: ${RAAD_PAYMENT__PROVIDER:-}
  RAAD_PAYMENT__PROVIDER_CREDENTIALS: '${RAAD_PAYMENT__PROVIDER_CREDENTIALS:-{}}'

services:
  postgres:
    image: postgres:16-alpine
    container_name: raad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raad}
      POSTGRES_DB: ${POSTGRES_DB:-raad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - raad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raad} -d ${POSTGRES_DB:-raad}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: raad-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Priority 1 Item 4 (PROJECT_STATUS.md, Redis production hardening) — see
    # docs/runbooks/redis-operations.md for the full reasoning behind each flag:
    #   --appendonly yes / --appendfsync everysec: Streams (ADR-0008), the rate limiter, and
    #     every other key here survive a container restart or crash via AOF, replayed at most
    #     one second of writes short of the crash (the standard, documented durability/throughput
    #     tradeoff — `always` gives zero loss at a severe per-write latency cost this workload
    #     doesn't need, `no` relies on the OS page cache flush alone). RDB snapshotting stays on
    #     Redis's own stock schedule (not overridden here) as a second, independent fallback.
    #   --maxmemory / --maxmemory-policy noeviction: bounds memory use, but *refuses* new writes
    #     with an OOM error once the ceiling is hit rather than silently evicting keys — this one
    #     instance holds both reconstructable cache data (latest position, geofence state, rate
    #     limits) *and* not-yet-consumed broker Streams entries (real, undelivered domain events)
    #     in different logical DBs (see RAAD_BROKER__URL's own comment above); Redis's
    #     maxmemory-policy is a server-wide setting; a per-key-type eviction policy isn't
    #     available in a single-instance topology, and losing a notification/tracking event to
    #     free cache space is never acceptable — so this errs toward "loud failure," never silent
    #     data loss, the same posture `.claude/rules/backend.md` #6 already establishes for
    #     safety-over-billing. Splitting broker/cache onto genuinely separate Redis processes
    #     (enabling a real per-purpose eviction policy) is a documented future step if load ever
    #     demands it, not attempted this phase (`.claude/rules/architecture.md` #7).
    #   --requirepass: previously unset entirely — anyone reaching this port (already not
    #     published outside the Docker network in prod, `docker-compose.prod.yml`'s own
    #     `ports: !reset []`) could read/write arbitrary data with no credential at all. The
    #     `dev-only-change-me` default here is the same convention `RAAD_AUTH__JWT_SECRET_KEY`
    #     already establishes — never used in the actual "how does prod get a real secret"
    #     decision, just a safe, obviously-not-production placeholder for a `docker/.env` that
    #     hasn't been filled in yet.
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--maxmemory", "${REDIS_MAXMEMORY:-256mb}",
        "--maxmemory-policy", "noeviction",
        "--requirepass", "${REDIS_PASSWORD:-dev-only-change-me}",
      ]
    environment:
      # Read by the healthcheck below (CMD-SHELL, not the exec-form CMD array — only a shell
      # invocation expands `$REDIS_PASSWORD` from the *container's own* environment; Compose's
      # own `${...}` substitution in `command:` above happens once, at `docker compose up` time,
      # on the host, and doesn't help a healthcheck that re-runs on its own interval inside the
      # already-started container).
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-change-me}
    volumes:
      - raad_redis_data:/data
    healthcheck:
      # A real bug caught by review, matching this phase's own theme: once --requirepass is set,
      # a bare `redis-cli ping` fails with NOAUTH, which would have made every container in this
      # stack "unhealthy" from the moment auth was enabled. `--no-auth-warning` only silences
      # redis-cli's own stderr nag about passing a password on a command line, not a real check.
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: *backend-build
    container_name: raad-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    container_name: raad-backend
    restart: unless-stopped
    command: ["uvicorn", "raad.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: *backend-build
    container_name: raad-worker
    restart: unless-stopped
    command: ["python", "-m", "raad.interfaces.workers.bootstrap"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    build:
      context: ..
      dockerfile: docker/backup.Dockerfile
    container_name: raad-backup
    restart: unless-stopped
    entrypoint: []
    # The image supplies the tools (pg_dump/pg_restore/rclone) and scripts; backup-loop.sh
    # supplies the schedule — matches backend.Dockerfile's own "one image, Compose decides what
    # runs" split (migrate/worker reuse one built image the same way).
    command: ["/app/backup-loop.sh"]
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-raad}
      PGPASSWORD: ${POSTGRES_PASSWORD:-raad}
      PGDATABASE: ${POSTGRES_DB:-raad}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - raad_backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

  device-gateway:
    build:
      context: ../services/device-gateway
      dockerfile: ../../docker/device-gateway.Dockerfile
    container_name: raad-device-gateway
    restart: unless-stopped
    environment:
      # Must match RAAD_BROKER__URL above exactly (password + db 1) — both deployables publish/
      # consume the same `raad:events` stream (ADR-0010), so a mismatched password or db number
      # here would silently split them onto two disjoint, unrelated streams.
      DEVICE_GATEWAY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
    ports:
      - "${DEVICE_GATEWAY_JT808_PORT:-7808}:7808"
      - "${DEVICE_GATEWAY_MDVR_PORT:-7809}:7809"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('localhost', 7809), 2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  jt1078-relay:
    build:
      context: ../services/jt1078
      dockerfile: ../../docker/jt1078-relay.Dockerfile
    container_name: raad-jt1078-relay
    restart: unless-stopped
    environment:
      # Must match RAAD_BROKER__URL/DEVICE_GATEWAY_BROKER_URL exactly (password + db 1) — all
      # three deployables coordinate over the same `raad:events` stream (ADR-0024 §8/§9).
      JT1078_RELAY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
      # Must match whatever secret a future Business API Jt1078RelayAdapter mints viewer tokens
      # with (ADR-0022's own "secrets are environment variables" precedent) — no default in
      # production; left as the dev-only placeholder here since no such adapter exists yet.
      JT1078_RELAY_VIEWER_TOKEN_SECRET: ${JT1078_RELAY_VIEWER_TOKEN_SECRET:-dev-only-change-me}
    ports:
      - "${JT1078_RELAY_INGEST_PORT:-7910}:7910"
      - "${JT1078_RELAY_VIEWER_PORT:-7911}:7911"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('localhost', 7911), 2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: dev
    container_name: raad-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost}
      VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      # 127.0.0.1, not localhost: BusyBox wget resolves "localhost" to ::1 first inside this
      # image's /etc/hosts and, unlike Python's urllib (backend's/device-gateway's healthchecks
      # above), does not fall back to the IPv4 address Vite/nginx actually bind — confirmed
      # against a live container, not assumed (ADR-0013's own Verification).
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: raad-prometheus
    restart: unless-stopped
    # Priority 1 Item 5 (PROJECT_STATUS.md, "minimum monitoring") — scrapes the Business API's
    # own /metrics (interfaces/http/health.py). Not published to a host port by default (no
    # `ports:` here) — reachable inside the Docker network for now; expose a port or add it
    # behind nginx/basic-auth before relying on it outside the host, the same "don't publish
    # more than the deployment actually needs" posture already applied to postgres/redis/backend
    # in docker-compose.prod.yml's own ports: !reset [] overrides.
    volumes:
      - ../infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - raad_prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: raad-nginx
    restart: unless-stopped
    # `gateway` profile (docker/.env.example's COMPOSE_PROFILES, on by default so every existing
    # dev/generic-VPS command below is unaffected) — lets docker-compose.coolify.yml's deployment
    # path exclude this service entirely just by NOT activating the profile, rather than needing
    # to (impossible) delete a service via a later override file. Coolify owns reverse-proxy/TLS
    # itself (its own Traefik) there, so running this nginx alongside it would be a second,
    # conflicting proxy.
    profiles: ["gateway"]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../infrastructure/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  raad_postgres_data:
  # Renamed from raad_redis_dev_data (Priority 1 Item 4) — this same base file already backs
  # both dev *and* prod (this file's own header comment: "same images, same services, same
  # topology in both environments"), so the old "_dev_" name was a stale, misleading holdover
  # from ADR-0012's original dev-only framing. Safe to rename outright: no VPS/production
  # deployment exists yet to have real data under the old name.
  raad_redis_data:
  raad_backups_data:
  raad_prometheus_data:
