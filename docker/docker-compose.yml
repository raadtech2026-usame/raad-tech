# RAAD Platform — base Docker Compose service definitions (ADR-0013: docs/architecture/adr/
# 0013-platform-dockerization.md). Alone, this file fully starts a working dev environment —
# `docker compose -f docker/docker-compose.yml up -d --build` (or `cd docker && docker compose
# up -d --build` once `docker/.env` exists — copy it from `docker/.env.example`).
# docker-compose.dev.yml layers on hot-reload/DX conveniences; docker-compose.prod.yml layers on
# VPS-only overrides (frontend's static build, real secrets, the prod Nginx conf). Same images,
# same services, same topology in both environments — see docker/README.md for exact commands.
#
# Per docs/business/RAAD_Phase2_Enterprise_Architecture_v1_2.md §11, MVP deployables are:
# Business API, Workers, JT808 TCP Server, JT1078 Video Server, plus PostgreSQL (ADR-0002),
# Redis, and an event broker. `services/jt1078/` stays out of this file — still no approved
# language/runtime (structural scaffold only), so there is nothing to containerize yet.
#
# `worker` is not one of the platform pieces named when this file was requested, but it's the
# already-built `python -m raad.interfaces.workers.bootstrap` process (Backend LLD §11.1) that
# the Notification/Report Workers, the outbox relay, and the three scheduled jobs run under —
# without a container running it, none of those ever fire in this stack. `migrate` is a one-off
# `alembic upgrade head` job, not a platform service — it exists so `backend`/`worker` never race
# each other to apply migrations on startup.

x-backend-build: &backend-build
  context: ../backend
  dockerfile: ../docker/backend.Dockerfile

x-backend-env: &backend-env
  RAAD_ENVIRONMENT: ${RAAD_ENVIRONMENT:-dev}
  RAAD_DB__URL: postgresql+asyncpg://${POSTGRES_USER:-raad}:${POSTGRES_PASSWORD:-raad}@postgres:5432/${POSTGRES_DB:-raad}
  RAAD_REDIS__URL: redis://redis:6379/0
  RAAD_BROKER__URL: redis://redis:6379/0
  RAAD_AUTH__JWT_SECRET_KEY: ${RAAD_AUTH__JWT_SECRET_KEY:-dev-only-change-me}
  RAAD_CORS__ALLOWED_ORIGINS: '${RAAD_CORS__ALLOWED_ORIGINS:-["http://localhost"]}'
  RAAD_OBSERVABILITY__LOG_LEVEL: ${RAAD_OBSERVABILITY__LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    container_name: raad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raad}
      POSTGRES_DB: ${POSTGRES_DB:-raad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - raad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raad} -d ${POSTGRES_DB:-raad}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: raad-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Streams (ADR-0008) survive a container restart via AOF persistence — dev convenience only,
    # not a durability guarantee.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - raad_redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: *backend-build
    container_name: raad-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    container_name: raad-backend
    restart: unless-stopped
    command: ["uvicorn", "raad.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: *backend-build
    container_name: raad-worker
    restart: unless-stopped
    command: ["python", "-m", "raad.interfaces.workers.bootstrap"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    build:
      context: ..
      dockerfile: docker/backup.Dockerfile
    container_name: raad-backup
    restart: unless-stopped
    entrypoint: []
    # The image supplies the tools (pg_dump/pg_restore/rclone) and scripts; backup-loop.sh
    # supplies the schedule — matches backend.Dockerfile's own "one image, Compose decides what
    # runs" split (migrate/worker reuse one built image the same way).
    command: ["/app/backup-loop.sh"]
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-raad}
      PGPASSWORD: ${POSTGRES_PASSWORD:-raad}
      PGDATABASE: ${POSTGRES_DB:-raad}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    volumes:
      - raad_backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

  device-gateway:
    build:
      context: ../services/device-gateway
      dockerfile: ../../docker/device-gateway.Dockerfile
    container_name: raad-device-gateway
    restart: unless-stopped
    environment:
      DEVICE_GATEWAY_BROKER_URL: redis://redis:6379/0
    ports:
      - "${DEVICE_GATEWAY_JT808_PORT:-7808}:7808"
      - "${DEVICE_GATEWAY_MDVR_PORT:-7809}:7809"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('localhost', 7809), 2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: dev
    container_name: raad-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost}
      VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      # 127.0.0.1, not localhost: BusyBox wget resolves "localhost" to ::1 first inside this
      # image's /etc/hosts and, unlike Python's urllib (backend's/device-gateway's healthchecks
      # above), does not fall back to the IPv4 address Vite/nginx actually bind — confirmed
      # against a live container, not assumed (ADR-0013's own Verification).
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: raad-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../infrastructure/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  raad_postgres_data:
  raad_redis_dev_data:
  raad_backups_data:
