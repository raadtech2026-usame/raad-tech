# REQUIRED POST-GENERATION PATCH 1 (Coolify deployment failure, found 2026-09-13): the command
# above reproduces `services.backup.entrypoint: []` verbatim from docker-compose.yml's own
# `entrypoint: []` (a standard, valid Compose directive clearing the postgres:16-alpine base
