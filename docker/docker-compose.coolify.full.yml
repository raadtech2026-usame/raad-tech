# cites this exact source line and states "coolify sets the compose project directory to be the
# root of the repo instead of the location of the compose file... yes its a bug"), reproduced
# empirically in this environment by running `docker compose --project-directory . -f
# docker/docker-compose.coolify.full.yml config` and observing every affected path resolve one
# directory level above this repository's own root. "Preserve Repository During Deployment"
# (a Coolify setting) does NOT fix this — it only controls whether repo files stay available for
# *volume* mounts post-build, not how `build.context` is resolved during the build itself.
# `dockerfile:` fields need no matching change: per the Compose Specification, a relative
# `dockerfile:` path is always resolved relative to `context:` (confirmed by inspecting this
# environment's own `docker compose config` output — `dockerfile:` stays an unresolved relative
# string while `context:` alone gets resolved to an absolute path), so each `context:`'s real
