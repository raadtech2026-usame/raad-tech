# config` itself, which accepts and normalizes both forms identically. After running the
# regenerate command above, manually change that one line from `entrypoint: []` to
# `entrypoint: ""` (empty string, not empty array) before committing. This is not a behavior
# change: empirically verified in this environment (`docker inspect` on a container created from
# each form) that `entrypoint: []` and `entrypoint: ""` compile to the byte-identical Docker
# Engine container config (`Entrypoint: []`, same `Cmd`) — only the YAML field's declared type
# changes, from array to string, which is what satisfies Coolify's stricter schema.
#
# REQUIRED POST-GENERATION PATCH 2 (Coolify deployment failure, found 2026-09-13, root-caused
# 2026-09-14): every `build.context` and relative bind-mount `source:` in this file must be
# written relative to the REPOSITORY ROOT, not relative to this file's own `docker/` directory —
# the opposite of what a plain `docker compose -f docker/docker-compose.coolify.full.yml build`
# would need (which resolves relative paths against the compose file's own directory, the
# Compose Specification's documented default). Root cause, confirmed against Coolify's own
# source, not inferred: `app/Jobs/ApplicationDeploymentJob.php` builds every Compose deployment
# with `--project-directory {workdir} -f {workdir}{docker_compose_location} build`, i.e. it
# unconditionally pins `--project-directory` to the repository root regardless of where the
# compose file itself lives. Per the Compose Specification, an *explicit* `--project-directory`
# is what relative paths resolve against, not the compose file's directory — so a path written
# as `../backend` (correct for `docker/`-relative resolution) instead resolves to one level
# *above* the repository root under Coolify's forced invocation, landing outside the cloned repo
