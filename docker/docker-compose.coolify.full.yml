#      Re-running the regenerate command without reapplying this patch will silently reintroduce
#      the "unable to prepare context: path ... not found" failure.
#   5. Every repo-root-relative bind-mount `source:` below is written with an explicit `./`
#      prefix (e.g. `./infrastructure/nginx/conf.d/frontend.conf`), unlike `build.context` in
