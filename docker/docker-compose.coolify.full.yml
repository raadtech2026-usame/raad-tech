# Practical consequence, verified in this environment: this file can no longer be built directly
# with a plain `docker compose -f docker/docker-compose.coolify.full.yml build` — that resolves
# `context: backend` against `docker/` (Compose's default project-directory) and looks for a
# nonexistent `docker/backend`. To exercise this file manually (outside Coolify), pass the same
# flag Coolify does, from the repository root:
#   docker compose --project-directory . -f docker/docker-compose.coolify.full.yml build
