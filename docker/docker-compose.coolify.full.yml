# ==============================================================================================
# GENERATED FILE - DO NOT HAND-EDIT. Regenerate instead (see command below).
#
# This is the single-file, fully-merged production Compose stack for a Coolify "Docker Compose"
# resource, produced because Coolify's Compose resource type offers only "Managed by Coolify" or
# "Raw (deploy file as-is)" - there is no UI to supply a second `-f` override file. The project's
# real source of truth stays split, exactly as designed
# (docs/runbooks/coolify-deployment.md, docker/README.md):
#
#   docker/docker-compose.yml           - the base stack (dev-safe on its own)
#   docker/docker-compose.coolify.yml   - the Coolify overlay (ADR-0022, ADR-0045)
#
# This file is the mechanical result of merging exactly those two - nothing added, removed, or
# hand-adjusted beyond what `docker compose config` produces plus the two numbered patches below.
# If either source file changes, regenerate this file the same way; never patch it directly, or
# it will silently drift from the two files it is supposed to mirror.
#
# Regenerate with (from the repository root; `--no-interpolate` is required - without it, this
# command bakes whatever is in your *local* docker/.env, including local secrets, into the
# committed file, and defeats Coolify's own environment-variable substitution at deploy time,
# `${SOURCE_COMMIT}` included; `--no-path-resolution` is required - without it, bind mounts are
# rewritten to this machine's own absolute filesystem path, meaningless on Coolify's VPS):
#
#   COMPOSE_PROFILES= docker compose --env-file /dev/null \
#     -f docker/docker-compose.yml -f docker/docker-compose.coolify.yml \
#     config --no-interpolate --no-path-resolution > docker/docker-compose.coolify.full.yml
#
# `docker compose config` strips all comments, so this header must be re-prepended by hand after
# every regeneration, together with the two patches below. `scripts/regenerate-coolify-compose.sh`
# does all three steps and is the supported way to do it.
#
# ----------------------------------------------------------------------------------------------
# PRE-BUILT IMAGES (ADR-0045, 2026-09-22) - the most important thing to know about this file.
#
# Every RAAD service below carries `image: ghcr.io/raadtech2026-usame/raad-*:${SOURCE_COMMIT}` and
# NO `build:` section. Coolify's deployment job runs, in order:
#
#   docker compose ... build --pull              (no-op here: nothing is buildable)
#   docker compose --env-file <workdir>/.env ... pull --ignore-buildable
#   docker compose ... up --pull always --build -d
#
# so every service is pulled, not built. Building these seven services on the 4 vCPU production
# VPS saturated ~70-100% of all cores for 1-2 minutes per deploy (1-minute load average measured
# at 5.41 on 2026-09-22 16:10 UTC) and is what triggered Hostinger's CPU-limit warning.
# GitHub Actions (.github/workflows/publish-images.yml) now builds and publishes the images.
#
# `${SOURCE_COMMIT}` is written by Coolify itself into the `.env` it passes to compose, so the
# tag always equals the commit being deployed. Deliberately NO `:-` default: an empty value
# yields an invalid image reference that fails at `pull`, BEFORE `up` touches a running
# container - the safe failure. A fallback to a mutable tag would silently deploy wrong code.
#
# backend, migrate and worker intentionally share ONE image (`raad-backend`); they differ only in
# their `command:`. Coolify used to build that identical image three times per deploy.
#
# ----------------------------------------------------------------------------------------------
# REQUIRED POST-GENERATION PATCH 1 (Coolify deployment failure, found 2026-09-13): the regenerate
# command reproduces `services.backup.entrypoint: []` verbatim from docker-compose.yml's own
# `entrypoint: []` (a valid Compose directive clearing the postgres:16-alpine base image's
# ENTRYPOINT so `command: ["/app/backup-loop.sh"]` runs directly). Coolify's own Compose-file
# validator rejects the empty-*array* form: "services.backup.entrypoint must be a null" - it
# accepts only a string or null, unlike `docker compose config`, which normalizes both forms
# identically. After regenerating, change that one line to `entrypoint: ""` (empty string).
# Not a behavior change: verified by `docker inspect` that both forms compile to the identical
# Docker Engine container config; only the YAML field's declared type changes.
#
# REQUIRED POST-GENERATION PATCH 2 (Coolify deployment failure, found 2026-09-14): every
# repo-root-relative bind-mount `source:` must be written with an explicit `./` prefix
# (`./infrastructure/...`). A bare path with no leading `./` is ambiguous with a *named volume*
# reference even when `type: bind` is stated, and Coolify's validator resolves that ambiguity
# against the top-level `volumes:` list, failing with `service "frontend" refers to undefined
# volume infrastructure/nginx/conf.d/frontend.conf: invalid compose project`. Coolify builds
# every Compose deployment with `--project-directory {workdir}` pinned to the repository root
# (app/Jobs/ApplicationDeploymentJob.php), so these paths resolve against the repo root, which is
# why they are repo-root-relative rather than `docker/`-relative.
#
# A THIRD PATCH USED TO LIVE HERE AND IS NOW OBSOLETE (ADR-0045). It rewrote every
# `build.context` to be repository-root-relative, working around confirmed upstream Coolify bug
# coollabsio/coolify#5182 (the forced `--project-directory` breaks `docker/`-relative build
# contexts). With no `build:` sections left in this file there are no build contexts to rewrite,
# so that patch - and the documented coupling risk of having to undo it if #5182 is ever fixed -
# is simply gone.
#
# In Coolify: New Resource -> Docker Compose, pointing at this exact file. Then follow
# docs/runbooks/coolify-deployment.md and docs/runbooks/ghcr-deployment.md - env vars via
# Coolify's own UI, domain assignment, the device-plane firewall/DNS step - none of which is
# expressible inside a Compose file.
#
# Two things this merge faithfully carries over, disclosed rather than silently fixed:
#   1. `COMPOSE_PROFILES` must be left unset/empty in Coolify's environment-variable store.
#      `nginx` is still present below (gated behind `profiles: [gateway]`, from the base file) -
#      it only starts if that profile is activated. `certbot` does not appear at all: it is
#      defined only in docker-compose.prod.yml, which is not part of this merge.
#   2. The base file's frontend healthcheck probes port 5173 (the Vite dev server); the Coolify
#      overlay replaces it with a port-80 probe matching the published `prod`-stage image.
# ==============================================================================================
name: docker
networks:
  default:
    name: docker_default
services:
  backend:
    command:
      - uvicorn
      - raad.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    container_name: raad-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: true
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      RAAD_AUTH__JWT_SECRET_KEY: ${RAAD_AUTH__JWT_SECRET_KEY:-dev-only-change-me}
      RAAD_BROKER__STREAM_MAX_LENGTH: ${RAAD_BROKER__STREAM_MAX_LENGTH:-0}
      RAAD_BROKER__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
      RAAD_CORS__ALLOWED_ORIGINS: ${RAAD_CORS__ALLOWED_ORIGINS:-["http://localhost"]}
      RAAD_DB__URL: postgresql+asyncpg://${POSTGRES_USER:-raad}:${POSTGRES_PASSWORD:-raad}@postgres:5432/${POSTGRES_DB:-raad}
      RAAD_DEVICE_PLANE__JT1078_SIGNALING_URL: ${JT1078_SIGNALING_URL:-ws://localhost:7911}
      RAAD_ENVIRONMENT: ${RAAD_ENVIRONMENT:-dev}
      RAAD_OBSERVABILITY__LOG_LEVEL: ${RAAD_OBSERVABILITY__LOG_LEVEL:-INFO}
      RAAD_PAYMENT__PROVIDER: ${RAAD_PAYMENT__PROVIDER:-}
      RAAD_PAYMENT__PROVIDER_CREDENTIALS: ${RAAD_PAYMENT__PROVIDER_CREDENTIALS:-{}}
      RAAD_REDIS__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/0
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 30s
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',
          timeout=3)
      timeout: 5s
    image: ghcr.io/raadtech2026-usame/raad-backend:${SOURCE_COMMIT}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
  backup:
    command:
      - /app/backup-loop.sh
    container_name: raad-backup
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    entrypoint: ""
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-15}
      BACKUP_WAIT_FOR_DB_SECONDS: ${BACKUP_WAIT_FOR_DB_SECONDS:-120}
      PGDATABASE: ${POSTGRES_DB:-raad}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-raad}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-raad}
    image: ghcr.io/raadtech2026-usame/raad-backup:${SOURCE_COMMIT}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: raad_backups_data
        target: /backups
        type: volume
        volume: {}
  device-gateway:
    container_name: raad-device-gateway
    depends_on:
      redis:
        condition: service_healthy
        required: true
    environment:
      DEVICE_GATEWAY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
      DEVICE_GATEWAY_LOG_LEVEL: ${DEVICE_GATEWAY_LOG_LEVEL:-INFO}
      DEVICE_GATEWAY_REDIS_URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/0
      DEVICE_GATEWAY_STREAM_MAX_LENGTH: ${DEVICE_GATEWAY_STREAM_MAX_LENGTH:-0}
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 20s
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 7809), 2)
      timeout: 3s
    image: ghcr.io/raadtech2026-usame/raad-device-gateway:${SOURCE_COMMIT}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    ports:
      - ${DEVICE_GATEWAY_JT808_PORT:-7808}:7808
      - ${DEVICE_GATEWAY_MDVR_PORT:-7809}:7809
    restart: unless-stopped
  frontend:
    container_name: raad-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost/api/v1}
      VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost}
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 20s
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      timeout: 5s
    image: ghcr.io/raadtech2026-usame/raad-frontend:${SOURCE_COMMIT}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./infrastructure/nginx/conf.d/frontend.conf
        target: /etc/nginx/conf.d/default.conf
        type: bind
  jt1078-relay:
    container_name: raad-jt1078-relay
    depends_on:
      redis:
        condition: service_healthy
        required: true
    environment:
      JT1078_RELAY_ABSOLUTE_IDLE_SECONDS: ${JT1078_RELAY_ABSOLUTE_IDLE_SECONDS:-60}
      JT1078_RELAY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
      JT1078_RELAY_ENVIRONMENT: ${JT1078_RELAY_ENVIRONMENT:-dev}
      JT1078_RELAY_IDLE_SWEEP_INTERVAL_SECONDS: ${JT1078_RELAY_IDLE_SWEEP_INTERVAL_SECONDS:-5}
      JT1078_RELAY_INGEST_TIMEOUT_SECONDS: ${JT1078_RELAY_INGEST_TIMEOUT_SECONDS:-30}
      JT1078_RELAY_MAX_GLOBAL_SESSIONS: ${JT1078_RELAY_MAX_GLOBAL_SESSIONS:-50}
      JT1078_RELAY_MAX_SESSIONS_PER_ORGANIZATION: ${JT1078_RELAY_MAX_SESSIONS_PER_ORGANIZATION:-8}
      JT1078_RELAY_PUBLIC_INGEST_HOST: ${JT1078_RELAY_PUBLIC_INGEST_HOST:-}
      JT1078_RELAY_STREAM_MAX_LENGTH: ${JT1078_RELAY_STREAM_MAX_LENGTH:-0}
      JT1078_RELAY_VIEWER_GRACE_SECONDS: ${JT1078_RELAY_VIEWER_GRACE_SECONDS:-15}
      JT1078_RELAY_VIEWER_STUCK_TIMEOUT_SECONDS: ${JT1078_RELAY_VIEWER_STUCK_TIMEOUT_SECONDS:-30}
      JT1078_RELAY_VIEWER_TOKEN_SECRET: ${JT1078_RELAY_VIEWER_TOKEN_SECRET:-dev-only-change-me}
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 20s
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('localhost', 7911), 2)
      timeout: 3s
    image: ghcr.io/raadtech2026-usame/raad-jt1078-relay:${SOURCE_COMMIT}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    ports:
      - ${JT1078_RELAY_INGEST_PORT:-7910}:7910
      - ${JT1078_RELAY_VIEWER_PORT:-7911}:7911
    restart: unless-stopped
  migrate:
    command:
      - alembic
      - upgrade
      - head
    container_name: raad-migrate
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      RAAD_AUTH__JWT_SECRET_KEY: ${RAAD_AUTH__JWT_SECRET_KEY:-dev-only-change-me}
      RAAD_BROKER__STREAM_MAX_LENGTH: ${RAAD_BROKER__STREAM_MAX_LENGTH:-0}
      RAAD_BROKER__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
      RAAD_CORS__ALLOWED_ORIGINS: ${RAAD_CORS__ALLOWED_ORIGINS:-["http://localhost"]}
      RAAD_DB__URL: postgresql+asyncpg://${POSTGRES_USER:-raad}:${POSTGRES_PASSWORD:-raad}@postgres:5432/${POSTGRES_DB:-raad}
      RAAD_DEVICE_PLANE__JT1078_SIGNALING_URL: ${JT1078_SIGNALING_URL:-ws://localhost:7911}
      RAAD_ENVIRONMENT: ${RAAD_ENVIRONMENT:-dev}
      RAAD_OBSERVABILITY__LOG_LEVEL: ${RAAD_OBSERVABILITY__LOG_LEVEL:-INFO}
      RAAD_PAYMENT__PROVIDER: ${RAAD_PAYMENT__PROVIDER:-}
      RAAD_PAYMENT__PROVIDER_CREDENTIALS: ${RAAD_PAYMENT__PROVIDER_CREDENTIALS:-{}}
      RAAD_REDIS__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/0
    image: ghcr.io/raadtech2026-usame/raad-backend:${SOURCE_COMMIT}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: 'no'
  nginx:
    container_name: raad-nginx
    depends_on:
      backend:
        condition: service_healthy
        required: true
      frontend:
        condition: service_started
        required: true
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 20s
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/health
      timeout: 5s
    image: nginx:1.27-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    ports:
      - ${NGINX_PORT:-80}:80
    profiles:
      - gateway
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./infrastructure/nginx/conf.d/dev.conf
        target: /etc/nginx/conf.d/default.conf
        type: bind
  postgres:
    container_name: raad-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raad}
      POSTGRES_USER: ${POSTGRES_USER:-raad}
    healthcheck:
      interval: 30s
      retries: 10
      start_interval: 2s
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-raad} -d ${POSTGRES_DB:-raad}
      timeout: 3s
    image: postgres:16-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: raad_postgres_data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
  prometheus:
    container_name: raad-prometheus
    depends_on:
      backend:
        condition: service_started
        required: true
    image: prom/prometheus:v2.53.0
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./infrastructure/monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ./infrastructure/monitoring/prometheus/alerts.yml
        target: /etc/prometheus/alerts.yml
        type: bind
      - source: raad_prometheus_data
        target: /prometheus
        type: volume
        volume: {}
  redis:
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-dev-only-change-me}
    container_name: raad-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-change-me}
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 20s
      test:
        - CMD-SHELL
        - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
      timeout: 3s
    image: redis:7-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: raad_redis_data
        target: /data
        type: volume
        volume: {}
  worker:
    command:
      - python
      - -m
      - raad.interfaces.workers.bootstrap
    container_name: raad-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
        required: true
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      RAAD_AUTH__JWT_SECRET_KEY: ${RAAD_AUTH__JWT_SECRET_KEY:-dev-only-change-me}
      RAAD_BROKER__STREAM_MAX_LENGTH: ${RAAD_BROKER__STREAM_MAX_LENGTH:-0}
      RAAD_BROKER__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
      RAAD_CORS__ALLOWED_ORIGINS: ${RAAD_CORS__ALLOWED_ORIGINS:-["http://localhost"]}
      RAAD_DB__URL: postgresql+asyncpg://${POSTGRES_USER:-raad}:${POSTGRES_PASSWORD:-raad}@postgres:5432/${POSTGRES_DB:-raad}
      RAAD_DEVICE_PLANE__JT1078_SIGNALING_URL: ${JT1078_SIGNALING_URL:-ws://localhost:7911}
      RAAD_ENVIRONMENT: ${RAAD_ENVIRONMENT:-dev}
      RAAD_OBSERVABILITY__LOG_LEVEL: ${RAAD_OBSERVABILITY__LOG_LEVEL:-INFO}
      RAAD_PAYMENT__PROVIDER: ${RAAD_PAYMENT__PROVIDER:-}
      RAAD_PAYMENT__PROVIDER_CREDENTIALS: ${RAAD_PAYMENT__PROVIDER_CREDENTIALS:-{}}
      RAAD_REDIS__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/0
    healthcheck:
      interval: 30s
      retries: 3
      start_interval: 2s
      start_period: 20s
      test:
        - CMD
        - python
        - -c
        - import os,sys; sys.exit(0 if any('raad.interfaces.workers.bootstrap' in
          open('/proc/'+p+'/cmdline','rb').read().decode('utf-8','ignore') for p in
          os.listdir('/proc') if p.isdigit()) else 1)
      timeout: 5s
    image: ghcr.io/raadtech2026-usame/raad-backend:${SOURCE_COMMIT}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    networks:
      default: null
    restart: unless-stopped
volumes:
  raad_backups_data:
    name: docker_raad_backups_data
  raad_postgres_data:
    name: docker_raad_postgres_data
  raad_prometheus_data:
    name: docker_raad_prometheus_data
  raad_redis_data:
    name: docker_raad_redis_data
x-backend-build:
  context: ../backend
  dockerfile: ../docker/backend.Dockerfile
x-backend-env:
  RAAD_AUTH__JWT_SECRET_KEY: ${RAAD_AUTH__JWT_SECRET_KEY:-dev-only-change-me}
  RAAD_BROKER__STREAM_MAX_LENGTH: ${RAAD_BROKER__STREAM_MAX_LENGTH:-0}
  RAAD_BROKER__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/1
  RAAD_CORS__ALLOWED_ORIGINS: ${RAAD_CORS__ALLOWED_ORIGINS:-["http://localhost"]}
  RAAD_DB__URL: postgresql+asyncpg://${POSTGRES_USER:-raad}:${POSTGRES_PASSWORD:-raad}@postgres:5432/${POSTGRES_DB:-raad}
  RAAD_DEVICE_PLANE__JT1078_SIGNALING_URL: ${JT1078_SIGNALING_URL:-ws://localhost:7911}
  RAAD_ENVIRONMENT: ${RAAD_ENVIRONMENT:-dev}
  RAAD_OBSERVABILITY__LOG_LEVEL: ${RAAD_OBSERVABILITY__LOG_LEVEL:-INFO}
  RAAD_PAYMENT__PROVIDER: ${RAAD_PAYMENT__PROVIDER:-}
  RAAD_PAYMENT__PROVIDER_CREDENTIALS: ${RAAD_PAYMENT__PROVIDER_CREDENTIALS:-{}}
  RAAD_REDIS__URL: redis://:${REDIS_PASSWORD:-dev-only-change-me}@redis:6379/0
x-logging:
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m
